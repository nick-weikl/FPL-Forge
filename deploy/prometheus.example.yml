# Replace the domain and exporter address; do not publish database or backend ports.
global:
  scrape_interval: 30s
rule_files:
  - /etc/prometheus/fpl-alerts.yml
scrape_configs:
  - job_name: fpl-forge-readiness
    metrics_path: /probe
    params:
      module: [fpl_ready]
    static_configs:
      - targets: [https://forge.example.invalid/healthz]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
